services:
  - type: web
    name: brus-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
